# Build e05 and run the test suite on every push to main and every pull
# request. GhosttyKit is restored from cache (or built from the pinned
# ghostty source on a miss), mirroring the release workflow so the same
# patched binary the release ships against is exercised by the tests.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: deny by default; the job reads the repo only.
permissions: {}

# Cancel superseded runs on the same ref so a busy PR doesn't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GHOSTTY_REPO: https://github.com/ghostty-org/ghostty
  # ghostty's minimum_zig_version; the main `zig` formula is on 0.16+.
  ZIG_FORMULA: zig@0.15

jobs:
  test:
    name: Build and test
    runs-on: macos-26   # Apple Silicon; matches the release runner
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # bash and zsh ship with macOS; fish does not, and a shell e05
      # claims to support has to be one CI actually runs. Homebrew
      # rather than nix: the nix closure for fish on darwin is 1.4 GB
      # against a bottle whose only dependency is pcre2.
      - name: Install fish
        run: brew install fish

      # The shell-integration snippets are not reachable from a Swift
      # test. Pure shell with no build inputs, so this runs ahead of the
      # GhosttyKit step and fails in seconds rather than minutes.
      - name: Test shell integration
        run: ./scripts/test-shell-integration.sh

      # --- GhosttyKit: restore the patched xcframework, or build it from
      # source. Keyed on the pinned ghostty commit + the local patches so a
      # patch edit (without a ghostty bump) rebuilds and a stale binary is
      # never tested against. ---
      - name: Restore GhosttyKit cache
        id: ghostty_cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: GhosttyKit.xcframework
          key: ghosttykit-${{ runner.os }}-${{ hashFiles('GHOSTTY_VERSION', 'patches/**') }}

      # Homebrew's zig, not an upstream tarball: ghostty's own flake picks
      # `zig.packages.<system>.brew."0.15.2"` on Darwin and the plain build
      # everywhere else, and upstream 0.15.2 indeed links no libSystem
      # symbol at all here. CONTRIBUTING calls for the same keg locally.
      - name: Install zig (only on cache miss)
        if: ${{ steps.ghostty_cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          brew install "$ZIG_FORMULA"
          PREFIX="$(brew --prefix "$ZIG_FORMULA")"
          "$PREFIX/bin/zig" version
          echo "$PREFIX/bin" >> "$GITHUB_PATH"

      - name: Download Metal Toolchain (only on cache miss)
        if: ${{ steps.ghostty_cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          # The GhosttyKit build links a Metal step that needs the toolchain
          # component (not preinstalled) and a CoreSimulator in sync.
          xcodebuild -downloadComponent MetalToolchain
          sudo xcodebuild -runFirstLaunch || true

      - name: Build patched GhosttyKit from source (only on cache miss)
        if: ${{ steps.ghostty_cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          # Pinned ghostty commit (last non-comment line of GHOSTTY_VERSION).
          GHOSTTY_SHA="$(grep -vE '^[[:space:]]*#' GHOSTTY_VERSION | grep -vE '^[[:space:]]*$' | head -1 | tr -d '[:space:]')"
          echo "Building GhosttyKit from ghostty@${GHOSTTY_SHA}"
          # Shallow-fetch exactly the pinned commit (GitHub serves a
          # reachable SHA). No submodules: zig fetches ghostty's deps itself.
          git init -q ghostty
          git -C ghostty remote add origin "$GHOSTTY_REPO"
          git -C ghostty fetch -q --depth 1 origin "$GHOSTTY_SHA"
          git -C ghostty checkout -q FETCH_HEAD
          # e05's local libghostty patches (add ghostty_* C symbols e05
          # links against). Touches src/apprt/embedded.zig + include/ghostty.h.
          git -C ghostty apply "$GITHUB_WORKSPACE"/patches/*.patch
          # macOS-only minimal build that emits the apprt-enabled
          # xcframework. `-Demit-macos-app=false` because the xcframework
          # flag turns the app bundle on by default and e05 does not use
          # Ghostty.app; building it only adds time and a CodeSign step
          # that can fail for reasons unrelated to this build.
          ( cd ghostty && zig build \
              -Doptimize=ReleaseFast \
              -Dapp-runtime=none \
              -Demit-xcframework=true \
              -Dxcframework-target=native \
              -Demit-exe=false \
              -Demit-macos-app=false \
              -Dsentry=false )
          # Strip xattrs that can fail later steps, then vendor in.
          xattr -cr ghostty/macos/GhosttyKit.xcframework || true
          rm -rf GhosttyKit.xcframework
          cp -R ghostty/macos/GhosttyKit.xcframework ./GhosttyKit.xcframework

      # Sparkle is a local binary target fetched here rather than a remote
      # SwiftPM package, so the download is curl's — with retries and a
      # timeout — instead of SwiftPM's, which wedged silently for over
      # half an hour with neither.
      - name: Fetch Sparkle
        run: ./scripts/fetch_sparkle.sh

      # --- Swift build + test ---
      # Bounded well above the ~1 minute a healthy build takes, so a stall
      # surfaces early instead of consuming the job's 90-minute budget.
      - name: swift build
        timeout-minutes: 15
        run: swift build --disable-sandbox

      # The CLI cases run a subprocess and wait on a socket round trip;
      # a wedge there would otherwise sit silently to the job's ceiling.
      - name: swift test
        timeout-minutes: 15
        run: swift test --disable-sandbox

      # build_app.sh is a run of copies, rsyncs and file edits whose
      # failure mode is silence — a step that finds nothing to do leaves
      # the bundle emptier and exits 0. Three bugs shipped that way, and
      # none of them were reachable from a test, because nothing looked
      # at an assembled bundle. The dev flavour assembles from the debug
      # build that just ran, so this costs a second or two rather than
      # another compile, and it puts every build-time step under the same
      # check on every push instead of only at a release.
      - name: Assemble and verify the app bundle
        run: |
          ./scripts/build_app.sh dev
          ./scripts/verify_bundle.sh build/dev/e05.app
