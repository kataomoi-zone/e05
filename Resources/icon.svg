<?xml version="1.0" encoding="UTF-8"?>
<!--
  e05 app icon, single variant (white background, black letters).
  1024×1024 canvas, 800px ring of four stroked arcs in the workspace
  accent palette (see PaneContainerViewController+Workspaces.swift),
  with letters E (top) / 0 (bottom-left) / 5 (bottom-right) on the
  clean interior. macOS app icon does not natively support
  appearance-driven Light/Dark variants in Assets.xcassets, so the
  single white-canvas variant is shipped as-is.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Light theme: white canvas -->
  <rect width="1024" height="1024" fill="#ffffff"/>

  <!-- Ring split 9:1:1:1 — magenta covers 270° (6 → 3 o'clock the
       long way through 12), the remaining 90° in the bottom-right
       quadrant is divided into three 30° accent arcs in palette
       order. stroke-linecap="butt" so adjacent arcs meet flush at
       the boundaries. fill="none" so the interior stays canvas
       white. -->
  <g transform="translate(512 512)" fill="none" stroke-width="80" stroke-linecap="butt">
    <!-- Magenta (palette index 0): 6 → 12 → 3 clockwise (270°) -->
    <path d="M 0 400 A 400 400 0 1 1 400 0" stroke="#ce055b"/>
    <!-- Yellow-green (palette index 1): 3 → 4 o'clock (30°) -->
    <path d="M 400 0 A 400 400 0 0 1 346.41 200" stroke="#b0bf1f"/>
    <!-- Coral (palette index 2): 4 → 5 o'clock (30°) -->
    <path d="M 346.41 200 A 400 400 0 0 1 200 346.41" stroke="#ec6e65"/>
    <!-- Blue (palette index 3): 5 → 6 o'clock (30°) -->
    <path d="M 200 346.41 A 400 400 0 0 1 0 400" stroke="#0279c2"/>
  </g>

  <!-- Letters: pre-converted to <path> via scripts/text-to-path.swift
       (HelveticaNeue-Bold @ 320pt). The (x, y) anchors authored on the
       original <text> elements are treated as alphabetic baseline
       positions, matching how WebKit / Safari renders the equivalent
       text+dominant-baseline=central pair (empirically verified). -->
  <g fill="#000000">
    <!-- E at (512, 440) -->
    <path d="M425.28 211.52 L425.28 440.00 L598.72 440.00 L598.72 397.76 L475.52 397.76 L475.52 341.76 L586.24 341.76 L586.24 302.72 L475.52 302.72 L475.52 253.76 L596.16 253.76 L596.16 211.52 Z"/>
    <!-- 0 at (380, 770) -->
    <path d="M343.20 657.04 Q343.20 651.28 343.36 643.12 Q343.52 634.96 344.48 626.32 Q345.44 617.68 347.68 609.20 Q349.92 600.72 353.92 594.00 Q357.92 587.28 364.16 583.12 Q370.40 578.96 379.68 578.96 Q388.96 578.96 395.36 583.12 Q401.76 587.28 405.92 594.00 Q410.08 600.72 412.16 609.20 Q414.24 617.68 415.36 626.32 Q416.48 634.96 416.64 643.12 Q416.80 651.28 416.80 657.04 Q416.80 666.64 416.16 680.24 Q415.52 693.84 412.16 706.48 Q408.80 719.12 401.28 728.08 Q393.76 737.04 379.68 737.04 Q365.92 737.04 358.56 728.08 Q351.20 719.12 347.84 706.48 Q344.48 693.84 343.84 680.24 Q343.20 666.64 343.20 657.04 Z M297.76 657.04 Q297.76 690.64 304.32 713.20 Q310.88 735.76 322.08 749.20 Q333.28 762.64 348.16 768.40 Q363.04 774.16 379.68 774.16 Q396.64 774.16 411.52 768.40 Q426.40 762.64 437.76 749.20 Q449.12 735.76 455.68 713.20 Q462.24 690.64 462.24 657.04 Q462.24 624.40 455.68 602.16 Q449.12 579.92 437.76 566.48 Q426.40 553.04 411.52 547.28 Q396.64 541.52 379.68 541.52 Q363.04 541.52 348.16 547.28 Q333.28 553.04 322.08 566.48 Q310.88 579.92 304.32 602.16 Q297.76 624.40 297.76 657.04 Z"/>
    <!-- 5 at (644, 770) -->
    <path d="M715.04 583.44 L715.04 546.00 L589.92 546.00 L567.84 669.84 L608.80 669.84 Q615.52 660.56 623.20 656.24 Q630.88 651.92 643.04 651.92 Q652.32 651.92 659.36 655.12 Q666.40 658.32 671.52 664.08 Q676.64 669.84 679.20 677.52 Q681.76 685.20 681.76 693.84 Q681.76 702.16 679.04 710.00 Q676.32 717.84 671.36 723.76 Q666.40 729.68 659.20 733.36 Q652.00 737.04 643.04 737.04 Q627.68 737.04 617.76 727.92 Q607.84 718.80 606.24 703.44 L560.80 703.44 Q561.12 721.04 568.00 734.32 Q574.88 747.60 586.40 756.56 Q597.92 765.52 612.80 769.84 Q627.68 774.16 644.00 774.16 Q660.96 774.48 676.00 768.56 Q691.04 762.64 702.40 751.76 Q713.76 740.88 720.48 726.00 Q727.20 711.12 727.20 693.84 Q727.20 678.16 722.56 664.24 Q717.92 650.32 709.12 640.08 Q700.32 629.84 687.52 623.76 Q674.72 617.68 658.08 617.68 Q644.64 617.68 634.08 621.68 Q623.52 625.68 614.24 634.96 L613.60 634.32 L622.56 583.44 Z"/>
